# Portal routing for the niri session (XDG_CURRENT_DESKTOP=niri).
# A desktop-specific file outranks the generic ~/.config/xdg-desktop-portal/portals.conf, which routes every backend
# to the Plasma portals and would send ScreenCast to KWin's portal. niri has no KWin, so screen share needs the GNOME
# portal. Mirrors the system niri-portals.conf except Secret: upstream names a keyring backend that is deliberately
# not installed (it would provide org.freedesktop.secrets, the D-Bus name KWallet serves for Plasma).
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
