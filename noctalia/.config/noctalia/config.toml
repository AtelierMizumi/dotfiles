# Noctalia overlay on top of the upstream defaults (example.toml). Only the keys below differ.
# Spec: docs/superpowers/specs/2026-10-24-niri-noctalia-rice-design.md

[theme]
mode = "dark"
# Colors come from the wallpaper. faithful keeps the bar tinted with the wallpaper's own hue; the default
# m3-tonal-spot came out near grey (compared on 7 wallpapers, 2026-10-25). The Mizu palette stays in palettes/ as a
# fixed alternative: source = "custom", custom_palette = "Mizu".
source = "wallpaper"
wallpaper_scheme = "faithful"
# Upstream default is true and runs `gsettings set org.gnome.desktop.interface color-scheme ...`,
# a user-wide write that also reaches GTK apps under Plasma.
sync_color_scheme = false

[theme.templates]
# Built-in and community templates stay off: the GTK/Qt/KColorScheme templates write gtk-* and kdeglobals, and the
# built-in niri template appends to niri/config.kdl (a stow symlink into this repo).
enable_builtin_templates = false
enable_community_templates = false

[theme.templates.user.niri-colors]
# The only template: the focus-ring colors for niri, rendered into ~/.config/niri/colors.kdl (included by config.kdl).
# Plasma never reads that directory, and there is no hook. scripts/check_noctalia.py allows exactly this shape.
input_path = "templates/niri-colors.kdl"
output_path = "~/.config/niri/colors.kdl"

[shell]
# Nothing else starts a polkit agent in a niri session.
polkit_agent = true

[widget.clock]
# The weekday name needs LC_TIME=ja_JP.UTF-8 on the noctalia process (set in the niri config).
format = "{:%-m}月{:%-d}日 {:%a} {:%H:%M}"

[idle]
# Desk setup with two fixed monitors: long timeouts, and no automatic suspend that would cut builds or downloads
# short. The screens turn off after 30 minutes and the session locks 15 minutes later, so waking the screens within
# that window resumes without a password. Idle inhibitors (video, calls) are respected.
behavior_order = ["screen-off", "lock"]
pre_action_fade_seconds = 3.0

[idle.behavior.screen-off]
action = "screen_off"
timeout = 1800

[idle.behavior.lock]
action = "lock"
timeout = 2700

[wallpaper]
# The wallpaper picker lists this folder (landscape/, anime/ and cinematic/ from Wallhaven, 2026-10-25).
directory = "~/Pictures/Wallpapers"

[wallpaper.default]
# ColdRipple from Plasma's wallpapers: a pier in fog. The wallpaper widget in the bar picks another one; that choice
# is saved in ~/.local/state/noctalia/settings.toml and wins over this default.
path = "/usr/share/wallpapers/ColdRipple/contents/images/2560x1440.jpg"
